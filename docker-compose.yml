
services:
  web:
    build: .
    image: teaching
    container_name: teaching_container
    restart: always
    command: "python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16.0
    container_name: db_teaching
    volumes:
      - postgres_teaching_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"

volumes:
  postgres_teaching_data:



